[workspace]
members = [
  "crates/fast-search-protocol",
  "crates/fast-search-index",
  "crates/fast-search-core",
  "crates/fast-search-engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
encoding_rs = "0.8.41"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
notify = "8.2.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
